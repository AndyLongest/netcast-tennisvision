name: Build private PPIO benchmark image

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Image tag to publish
        required: true
        default: benchmark-v1
  push:
    tags:
      - production-v*

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the selected revision
        uses: actions/checkout@v4

      - name: Enable Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Sign in to the private PPIO registry
        uses: docker/login-action@v3
        with:
          registry: image.ppinfra.com
          username: ${{ secrets.PPIO_REGISTRY_USERNAME }}
          password: ${{ secrets.PPIO_REGISTRY_PASSWORD }}

      - name: Build and publish the production code overlay
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.release
          push: true
          tags: ${{ secrets.PPIO_IMAGE_REPOSITORY }}:${{ inputs.image_tag || github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

