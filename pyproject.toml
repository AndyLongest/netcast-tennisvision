[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "netcast-tennisvision"
version = "0.1.0"
description = "Local-first fixed-camera tennis video analysis"
requires-python = ">=3.10,<3.13"

[project.scripts]
netcast-tennisvision = "netcast_tennisvision.api.server:main"
netcast-analyze = "netcast_tennisvision.pipeline.runner:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
cache_dir = ".cache/pytest"
addopts = "-q"
markers = [
    "assets: requires the frozen model files installed from assets/manifest.json",
    "integration: exercises multiple runtime components or external executables",
]

[tool.ruff]
target-version = "py310"
line-length = 100
cache-dir = ".cache/ruff"
extend-exclude = ["notebooks", "data", "models"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
