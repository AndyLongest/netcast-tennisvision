[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "assets: requires the frozen model files installed from assets/manifest.json",
    "integration: exercises multiple runtime components or external executables",
]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["notebooks", "data", "models"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
